<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medly | Sign Up</title>
</head>
<body>
    <header>
        <nav>
            <h1>Medly</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="#">Doctors</a></li>
                <li><a href="#">About</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form>
            <div>
                <label for="name">Name: </label>
                <input type="text" id="name" name="name" placeholder="Enter name" required>
            </div>

            <div>
                <label for="email">Email: </label>
                <input type="email" id="email" name="email" placeholder="Enter email" required>
            </div>

            <div>
                <label for="password">Password: </label>
                <input type="password" id="password" name="password" minlength="8" placeholder="Enter Password" required> 
            </div>

            <div>
                <label for="password2">Re-enter Password: </label>
                <input type="password" id="password2" name="password2" minlength="8" placeholder="Confirm Password" required>
            </div>

            <div>
                <label for="age">Age: </label>
                <input type="number" id="age" name="age" min="18" placeholder="Enter Age" required>
            </div>

            <div>
                <label for="dob">Enter Date of Birth: </label>
                <input type="date" id="dob" name="dob" placeholder="00/00/0000" required>
            </div>

            <div>
                <p>Choose Gender: </p>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male"> Male</label>

                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female"> Female</label>
            </div>

            <div>
                <label for="phone">Contact No: </label>
                <input type="tel" id="phone" name="phone" maxlength="10" minlength="10" pattern="[0-9]{10}" placeholder="0000000000" required>
            </div>

            <div>
                <p>Choose Preferences:(Optional) </p>
                <input type="checkbox" id="alopathy" name="preference" value="alopathy">
                <label for="alopathy">Alopathy: </label>

                <input type="checkbox" id="Homeopathy" name="preference" value="Homeopathy">
                <label for="Homeopathy">Homeopathy: </label>

                <input type="checkbox" id="Ayurvedic" name="preference" value="Ayurvedic">
                <label for="Ayurvedic">Ayurvedic: </label>
            </div>

            <div>
                <label for="pfp">Upload Image:</label>
                <input type="file" id="pfp" name="pfp">
            </div>

            <div>
                <input type="checkbox" id="tnc" name="tnc" value="yes" required>
                <label for="tnc">By clicking this you agree to our terms and conditions.</label>
            </div>

            <div>
                <button type="submit">Submit</button>
            </div>
        </form>
    </main>
</body>
</html>
